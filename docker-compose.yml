services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://homeolife:${POSTGRES_PASSWORD:-homeolife}@postgres:5432/homeolife
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_WHATSAPP_NUMBER: 6593571688
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Local/dev default so `docker compose up` works with zero setup. Override with your own
      # (generate via `npx auth secret`) for anything beyond local dev -- see .env.production.example.
      AUTH_SECRET: ${AUTH_SECRET:-UXLIxxqZ3TtXl500hfr68UegCm/sGncQpEzAV3iaEhQ=}
    ports:
      # Host-only on purpose: the app should never be reached directly from the internet in
      # production, only through the caddy service in docker-compose.prod.yml (port 80/443). This
      # also applies locally -- still reachable at localhost:3000, just not from other machines.
      - "127.0.0.1:3000:3000"
    volumes:
      - doctor-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeolife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeolife}
      POSTGRES_DB: homeolife
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeolife -d homeolife"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  doctor-uploads:
